<title>cryptopred · v15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* ── tokens.css ── */
/* ══════════════════════════════════════════════════════════════════
   tokens.css — NGUỒN CHÂN LÝ DUY NHẤT VỀ MÀU · prototype v15
   Hướng màu: "Graphite Gold" — nền than chì 4 bậc kế thừa Binance,
   vàng chỉ cho giao diện (nút, focus, tab), xanh/đỏ chỉ cho DỮ LIỆU
   tăng/giảm, TÍM độc quyền cho mọi thứ model sinh ra (RULE 7).

   Đã kiểm định (dataviz validate_palette.js, nền #181A20):
     up #0ECB81 ↔ down #F23645 : ΔE deutan 10.7 (≥ 8 đạt), tritan 40
     pred #A78BFA             : tương phản 6.4:1 trên --surface-1
   DS-RULE 8: thấy mã hex ở file khác ngoài file này là lỗi.
   ══════════════════════════════════════════════════════════════════ */
:root{
  /* Bề mặt 4 bậc */
  --surface-0:#0B0E11;  /* app, nav, footer */
  --surface-1:#181A20;  /* panel, chart */
  --surface-2:#1E2329;  /* card, input, hàng hover nhẹ */
  --surface-3:#2B3139;  /* hover đậm, track, chip nền */
  --border:#2B3139;
  --border-strong:#474D57;
  --grid:#2B3139;

  /* Chữ 3 bậc (tương phản trên --surface-1: 14.7 · 9.2 · 6.0) */
  --text-1:#EAECEF;
  --text-2:#B7BDC6;
  --text-3:#8F99A8;

  /* Giao diện — vàng CHỈ cho nút/focus/tab, không bao giờ cho dữ liệu (DS-RULE 5) */
  --accent:#F0B90B;
  --accent-hover:#FCD535;
  --on-accent:#0B0E11;
  --on-data:#0B0E11;    /* chữ trên nút Mua/Bán */
  --info:#5B9DFF;
  --warn:#FF8F3D;

  /* Dữ liệu tăng/giảm — đã kiểm định mù màu, luôn đi kèm ▲▼ + chữ (DS-RULE 3) */
  --green:#0ECB81;
  --red:#F23645;
  --up:var(--green);
  --down:var(--red);
  --down-text:#FF5C6C;  /* chữ nhỏ đỏ trên nền tối cần sáng hơn để đạt 6:1 */

  /* Dự đoán — TÍM độc quyền (RULE 7 / DS-RULE 4) */
  --pred:#A78BFA;
  --pred-band:rgba(167,139,250,.14);

  /* Trạng thái độ tươi — không bao giờ tái dụng làm màu chuỗi */
  --status-live:var(--up);
  --status-slow:var(--warn);
  --status-down:var(--down);
  --status-stale:var(--pred);

  /* Bộ so sánh nhiều chuỗi (đối chứng, baseline) — luôn có chú giải + nhãn trực tiếp */
  --series-1:#5B9DFF;
  --series-2:#FB923C;
  --series-3:#94A3B8;

  /* Chữ */
  --font-sans:"IBM Plex Sans","Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono","JetBrains Mono",ui-monospace,"SF Mono",monospace;
  --font-num:var(--font-mono);
  --fs-11:11px;--fs-12:12px;--fs-13:13px;--fs-14:14px;--fs-16:16px;--fs-20:20px;--fs-24:24px;--fs-32:32px;

  /* Khoảng cách · bo góc · chuyển động */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --r-1:4px;--r-2:6px;--r-pill:999px;
  --dur-flash:150ms;--dur-fast:120ms;--dur-base:200ms;
  --tap:44px;
  color-scheme:dark;
}

/* Chế độ mù màu đỏ-lục: đổi cặp dữ liệu sang xanh dương / cam (không chạm tím) */
:root[data-cvd="true"]{--up:#3B82F6;--down:#F97316;--down-text:#FDBA74}
/* Quy ước Á Đông: đỏ = tăng */
:root[data-updown="asia"]{--up:var(--red);--down:var(--green);--down-text:#34D399}

/* ── Chế độ SÁNG — bảng chọn riêng, đã kiểm định (không đảo tự động) ── */
:root[data-theme="light"]{
  --surface-0:#F5F7FA;--surface-1:#FFFFFF;--surface-2:#F0F2F5;--surface-3:#E4E7EC;
  --border:#E0E3EB;--border-strong:#B7BDC6;--grid:#E0E3EB;
  --text-1:#0B0E11;--text-2:#474D57;--text-3:#707A8A;
  --accent:#C99400;--accent-hover:#B58600;--on-accent:#FFFFFF;--on-data:#FFFFFF;
  --info:#1D6FE0;--warn:#C2410C;
  --green:#0E9F6E;--red:#E0303F;--down-text:#C9202F;
  --pred:#7C5CE6;--pred-band:rgba(124,92,230,.12);
  --series-1:#2A78D6;--series-2:#EA580C;--series-3:#64748B;
  color-scheme:light;
}

/* ── components.css ── */
/* ══════════════════════════════════════════════════════════════════
   components.css — KHUNG + COMPONENT dùng chung, prototype v15
   Không có mã màu ở đây: mọi màu là var(--token) từ tokens.css (DS-RULE 8).
   Không glow, không gradient, không bóng > 5% (brief §8).
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-0);color:var(--text-1);font:var(--fs-13)/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info);text-decoration:none}a:hover{text-decoration:underline}
img,svg,canvas{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Chữ số ────────────────────────────────────────────────────── */
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num-hero{font-family:var(--font-mono);font-variant-numeric:normal;font-weight:600;font-size:var(--fs-24);line-height:1.1}
.up-text{color:var(--up)}.down-text{color:var(--down-text,var(--down))}.pred-text{color:var(--pred);font-style:italic}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}.small{font-size:var(--fs-12)}.tiny{font-size:var(--fs-11)}
.mono{font-family:var(--font-mono)}
.strong{font-weight:600}

/* ── Khung ứng dụng ────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;min-height:100vh}
.topnav{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);background:var(--surface-0);border-bottom:1px solid var(--border)}
.topnav .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-14);color:var(--text-1);margin-right:var(--sp-2)}
.topnav .brand .logo{width:22px;height:22px;border-radius:4px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:12px}
.nav{display:flex;gap:2px}
.nav a{display:inline-flex;align-items:center;height:56px;padding:0 12px;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.nav a:hover{color:var(--text-1);text-decoration:none}
.nav a.is-active{color:var(--text-1);border-bottom-color:var(--accent)}
.topnav .spacer{flex:1}
.topnav .right{display:flex;align-items:center;gap:var(--sp-2)}
.pairbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface-1);color:var(--text-1);font-weight:600;cursor:pointer}
.pairbtn:hover{border-color:var(--border-strong)}
.pairbtn .caret{color:var(--text-3)}
.outlet{flex:1;width:100%}
.footer{height:28px;display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-4);border-top:1px solid var(--border);color:var(--text-3);font-size:var(--fs-11);background:var(--surface-0)}
.footer .spacer{flex:1}
.bottomnav{display:none}
.page{padding:var(--sp-4);max-width:1600px;margin:0 auto;width:100%}
.page-narrow{max-width:860px}
.subhead{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border);margin-bottom:var(--sp-4)}
.subhead h1{font-size:var(--fs-16);font-weight:600}
.subhead .spacer{flex:1}

/* ── Panel ─────────────────────────────────────────────────────── */
.panel{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-2);display:flex;flex-direction:column;min-width:0}
.panel-head{display:flex;align-items:center;gap:var(--sp-2);padding:8px 12px;border-bottom:1px solid var(--border);min-height:40px}
.panel-title{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.panel-title h2{font-size:var(--fs-13);font-weight:600;color:var(--text-1);white-space:nowrap}
.panel-sub{font-size:var(--fs-11);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-actions{display:flex;align-items:center;gap:4px}
.panel-body{padding:12px;min-height:0}
.panel.flush .panel-body{padding:0}
.panel.is-collapsed .panel-body{display:none}
.panel.is-collapsed .panel-head{border-bottom:0}
.panel-toggle .chev{display:block;width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-3px;transition:transform var(--dur-fast)}
.panel.is-collapsed .panel-toggle .chev{transform:rotate(-45deg);margin-top:2px}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-2);padding:12px}

/* ── Nút ───────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface-2);color:var(--text-1);font-weight:500;cursor:pointer;white-space:nowrap;transition:background var(--dur-fast),border-color var(--dur-fast)}
.btn:hover{background:var(--surface-3)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-buy{background:var(--up);border-color:var(--up);color:var(--on-data);font-weight:600}
.btn-sell{background:var(--down);border-color:var(--down);color:var(--on-data);font-weight:600}
.btn-buy:hover,.btn-sell:hover{filter:brightness(1.08)}
.btn-danger{background:transparent;border-color:var(--down);color:var(--down-text,var(--down))}
.btn-danger:hover{background:color-mix(in srgb,var(--down) 12%,transparent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{color:var(--text-1);background:var(--surface-2)}
.btn-sm{min-height:32px;padding:0 10px;font-size:var(--fs-12)}
.btn-block{width:100%}
.ibtn{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;padding:0 6px;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);cursor:pointer;font-size:var(--fs-12)}
.ibtn:hover{background:var(--surface-2);color:var(--text-1)}
.ibtn.is-active{color:var(--accent)}
@media(pointer:coarse){.ibtn{min-width:44px;min-height:44px}}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-1);overflow:hidden;background:var(--surface-1)}
.seg-btn{min-height:32px;padding:0 10px;border:0;background:transparent;color:var(--text-2);cursor:pointer;font-weight:500;font-size:var(--fs-12)}
.seg-btn+.seg-btn{border-left:1px solid var(--border)}
.seg-btn:hover{color:var(--text-1)}
.seg-btn.is-active{background:var(--surface-3);color:var(--text-1)}
.seg-btn.is-active.buy{color:var(--up)}.seg-btn.is-active.sell{color:var(--down-text,var(--down))}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{min-height:40px;padding:0 12px;border:0;background:transparent;color:var(--text-2);cursor:pointer;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text-1)}
.tab.is-active{color:var(--text-1);border-bottom-color:var(--accent)}
.tab .count{margin-left:4px;color:var(--text-3)}
kbd{display:inline-block;min-width:20px;padding:1px 5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;background:var(--surface-2);font:500 11px var(--font-mono);color:var(--text-1);text-align:center}

/* ── Form ──────────────────────────────────────────────────────── */
.input,.select,textarea.input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface-2);color:var(--text-1)}
.input:focus,.select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.input::placeholder{color:var(--text-3)}
.input.num{text-align:right}
.input[aria-invalid="true"]{border-color:var(--down)}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .suffix{position:absolute;right:12px;color:var(--text-3);font-size:var(--fs-12);pointer-events:none}
.input-wrap .input{padding-right:56px}
.frow{display:flex;flex-direction:column;gap:4px}
.flabel{font-size:var(--fs-12);color:var(--text-2);font-weight:500}
.fhint{font-size:var(--fs-11);color:var(--text-3)}
.inline-err{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:var(--fs-12);color:var(--down-text,var(--down))}
.inline-err::before{content:"✕";font-size:11px}
.check{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:var(--fs-12);color:var(--text-2)}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent)}
.pctrow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pctrow .btn{min-height:32px;padding:0;font-size:var(--fs-12)}
.range{width:100%;accent-color:var(--accent);height:24px}

/* ── Chip · badge · freshness · mode ───────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border:1px solid var(--border);border-radius:var(--r-1);font-size:var(--fs-11);font-weight:500;color:var(--text-2);white-space:nowrap;background:var(--surface-2)}
.chip-official{border-color:var(--accent);color:var(--text-1)}
.chip-rejected{border-color:var(--border-strong);color:var(--text-3);text-decoration:line-through}
.chip-pending{background:var(--surface-3);color:var(--text-3);border-color:transparent}
.chip-sim,.chip-pred{border-color:var(--pred);color:var(--pred);font-style:italic;background:transparent}
.chip-warn{border-color:var(--warn);color:var(--warn)}
.chip-info{border-color:var(--info);color:var(--info)}
.chip-up{border-color:var(--up);color:var(--up)}.chip-down{border-color:var(--down);color:var(--down-text,var(--down))}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-1);font-weight:600;font-size:var(--fs-12);white-space:nowrap}
.badge .badge-arrow{font-size:11px}
.badge-up{background:color-mix(in srgb,var(--up) 12%,transparent);border-color:color-mix(in srgb,var(--up) 40%,transparent);color:var(--up)}
.badge-down{background:color-mix(in srgb,var(--down) 12%,transparent);border-color:color-mix(in srgb,var(--down) 40%,transparent);color:var(--down-text,var(--down))}
.badge-flat{background:transparent;border-color:var(--border);color:var(--text-2)}
.badge.lg{height:44px;padding:0 16px;font-size:var(--fs-20)}
.badge.lg .badge-arrow{font-size:16px}
.badge.xl{height:56px;padding:0 20px;font-size:var(--fs-32)}
.badge.xl .badge-arrow{font-size:22px}
.badge .badge-p{margin-left:2px;opacity:.9}
/* Badge chủ của model: nền tím nhạt viền tím — hướng vẫn đủ ký hiệu + chữ; màu up/down chỉ ở text con */
.badge.master{border-color:var(--pred);background:var(--pred-band)}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-11);color:var(--text-2);white-space:nowrap}
.fresh-dot{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.fresh-live .fresh-dot{background:var(--status-live);animation:pulse 2s infinite}
.fresh-slow .fresh-dot{background:var(--status-slow)}
.fresh-down .fresh-dot{background:var(--status-down)}
.fresh-stale .fresh-dot{background:transparent;border:1.5px solid var(--status-stale)}
.fresh-down,.fresh-stale{color:var(--text-3)}
.fresh-at{color:var(--text-3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.modetag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r-1);font-size:var(--fs-11);font-weight:700;letter-spacing:.04em;border:1px solid}
.modetag-paper{color:var(--text-2);border-color:var(--border-strong);background:var(--surface-2)}
.modetag-real{color:var(--down-text,var(--down));border-color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
body[data-mode="TRADING"] .topnav{border-bottom:2px solid var(--down)}
body[data-mode="TRADING"] .realbar{display:flex}
.realbar{display:none;align-items:center;justify-content:center;gap:8px;height:28px;background:color-mix(in srgb,var(--down) 12%,transparent);color:var(--down-text,var(--down));font-weight:600;font-size:var(--fs-12)}
.flash-up{animation:flashUp var(--dur-flash) ease-out}
.flash-down{animation:flashDown var(--dur-flash) ease-out}
@keyframes flashUp{from{background:color-mix(in srgb,var(--up) 18%,transparent)}to{background:transparent}}
@keyframes flashDown{from{background:color-mix(in srgb,var(--down) 18%,transparent)}to{background:transparent}}

/* ── Bảng ──────────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-12)}
.tbl th{position:sticky;top:0;background:var(--surface-1);color:var(--text-3);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:var(--fs-11)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num-col,.tbl td.num{text-align:right}
.tbl td.empty{text-align:center;color:var(--text-3);padding:24px}
.tbl.dense td,.tbl.dense th{padding:3px 6px}
.tbl tr.clickable{cursor:pointer}

/* ── KPI / stat tile ───────────────────────────────────────────── */
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-label{font-size:var(--fs-11);color:var(--text-3);white-space:nowrap}
.kpi-value{font-family:var(--font-mono);font-weight:600;font-size:var(--fs-16);color:var(--text-1);white-space:nowrap}
.kpi-value.big{font-size:var(--fs-24);font-variant-numeric:normal}
.kpi-delta{font-size:var(--fs-11)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp-3)}

/* ── Lưới tiện ích ─────────────────────────────────────────────── */
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.stack-sm{display:flex;flex-direction:column;gap:var(--sp-2)}
.row{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
.gap-1{gap:var(--sp-1)}.gap-2{gap:var(--sp-2)}.gap-3{gap:var(--sp-3)}.gap-4{gap:var(--sp-4)}
.mt-2{margin-top:var(--sp-2)}.mt-3{margin-top:var(--sp-3)}.mt-4{margin-top:var(--sp-4)}
.divider{height:1px;background:var(--border);margin:var(--sp-2) 0}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
.note{padding:8px 10px;border-left:2px solid var(--border-strong);background:var(--surface-2);color:var(--text-2);font-size:var(--fs-12);border-radius:0 var(--r-1) var(--r-1) 0}
.note-warn{border-left-color:var(--warn)}
.note-danger{border-left-color:var(--down);color:var(--text-1)}
.note-info{border-left-color:var(--info)}
.note-pred{border-left-color:var(--pred)}
.disclaimer{font-size:var(--fs-11);color:var(--text-3);line-height:1.4}

/* ── Xác suất ──────────────────────────────────────────────────── */
.pmeter{display:flex;flex-direction:column;gap:2px}
.pmeter-track{position:relative;height:6px;border-radius:var(--r-pill);background:var(--surface-3)}
.pmeter-fill{height:100%;border-radius:var(--r-pill);background:var(--text-2)}
.pmeter-fill.fill-up{background:var(--up)}.pmeter-fill.fill-down{background:var(--down)}
.pmeter-mid{position:absolute;left:50%;top:-3px;width:1px;height:12px;background:var(--text-3)}
.pmeter-req{position:absolute;top:-4px;width:2px;height:14px;background:var(--pred);transform:translateX(-1px)}
.pmeter-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);font-family:var(--font-mono)}

/* ── Modal · toast · rỗng · skeleton ───────────────────────────── */
.modal-wrap{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--surface-0) 70%,transparent);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--r-2);padding:16px;display:flex;flex-direction:column;gap:12px}
.modal-wide{width:min(960px,100%)}
.modal h3{font-size:var(--fs-16);font-weight:600}
.modal-head{display:flex;align-items:center;justify-content:space-between}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#toasts{position:fixed;right:16px;bottom:44px;z-index:110;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{padding:10px 12px;border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text-1);font-size:var(--fs-12);display:flex;align-items:center;gap:10px}
.toast-ok{border-color:var(--up)}.toast-warn{border-color:var(--warn)}.toast-error{border-color:var(--down)}
.toast.out{opacity:0;transition:opacity var(--dur-base)}
.empty-state{padding:24px 12px;text-align:center;color:var(--text-2);font-size:var(--fs-12)}
.empty-state .hint{color:var(--text-3);margin-top:4px}
.skeleton{background:var(--surface-2);border-radius:var(--r-1);animation:pulse 1.6s infinite}
.loading-dim{opacity:.55;transition:opacity var(--dur-base)}

/* ── Chart ─────────────────────────────────────────────────────── */
.chart-wrap{position:relative;width:100%;height:var(--chart-h);min-height:var(--chart-h);background:var(--surface-1)}
.chart-canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:pan-y}
.chart-canvas:focus-visible{outline-offset:-2px}
.chart-tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-1);padding:6px 8px;font-size:var(--fs-11);min-width:150px;color:var(--text-2)}
.tip-row{display:flex;justify-content:space-between;gap:12px}
.tip-row:first-child{color:var(--text-1);font-weight:500;margin-bottom:2px}
.tip-row .num{color:var(--text-1)}
.spark{width:96px;height:28px;color:var(--text-2)}
.spark-empty{display:inline-block;width:96px;height:28px}
.linechart{width:100%;height:auto}
.tfbar{display:flex;gap:2px;flex-wrap:wrap}
.tfbar .ibtn{min-width:34px;font-family:var(--font-mono);font-weight:500}
.tfbar .ibtn.is-active{background:var(--surface-3);color:var(--text-1)}
.tfbar .ibtn.model{position:relative}
.tfbar .ibtn.model::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--pred);transform:translateX(-50%)}

/* ── Order book ────────────────────────────────────────────────── */
.ob{font-family:var(--font-mono);font-size:var(--fs-12);display:flex;flex-direction:column;gap:2px}
.ob-head,.ob-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:1px 8px;position:relative}
.ob-head{color:var(--text-3);font-size:var(--fs-11);font-family:var(--font-sans);padding:4px 8px}
.ob-row{cursor:pointer;min-height:20px;align-items:center}
.ob-row:hover{background:var(--surface-2)}
.ob-row>span:nth-child(2),.ob-row>span:nth-child(3),.ob-head>span:nth-child(2),.ob-head>span:nth-child(3){text-align:right}
.ob-row .bar{position:absolute;top:0;bottom:0;right:0;opacity:.12;pointer-events:none}
.ob-row.ask .price{color:var(--down-text,var(--down))}.ob-row.ask .bar{background:var(--down)}
.ob-row.bid .price{color:var(--up)}.ob-row.bid .bar{background:var(--up)}
.ob-spread{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:var(--fs-12);color:var(--text-2)}
.ob-spread .last{font-size:var(--fs-16);font-weight:600;color:var(--text-1)}

/* ── Ticker header ─────────────────────────────────────────────── */
.ticker{display:flex;align-items:center;gap:var(--sp-4);min-height:48px;padding:6px var(--sp-4);border-bottom:1px solid var(--border);background:var(--surface-0);overflow-x:auto;scrollbar-width:none}
.ticker .price{font-size:var(--fs-24);font-weight:600;font-family:var(--font-mono);white-space:nowrap;padding:2px 4px;border-radius:3px}
.ticker .price.is-down{color:var(--text-3)}
.ticker .stat{display:flex;flex-direction:column;gap:0;white-space:nowrap}
.ticker .stat .l{font-size:var(--fs-11);color:var(--text-3)}
.ticker .stat .v{font-size:var(--fs-12);color:var(--text-1)}
.ticker .spacer{flex:1}

/* ── Bố cục màn Giao dịch ──────────────────────────────────────── */
.trade{display:grid;grid-template-columns:280px minmax(0,1fr) 360px;grid-template-areas:"book chart side" "book bottom side";gap:var(--sp-2);padding:var(--sp-2);align-items:start}
.trade.layout-simple{grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"chart side" "bottom side"}
.trade.layout-simple .area-book{display:none}
.trade.layout-terminal{--bottom-h:400px}
.area-book{grid-area:book}.area-chart{grid-area:chart}.area-side{grid-area:side;display:flex;flex-direction:column;gap:var(--sp-2)}.area-bottom{grid-area:bottom}
.area-bottom .panel-body{height:var(--bottom-h,220px);overflow:auto;resize:vertical}
.signal-strip{display:flex;gap:3px;padding:6px 12px;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none;min-height:32px;align-items:center}
.sig{width:14px;height:14px;border:1.5px solid var(--pred);border-radius:2px;flex:none;cursor:pointer;background:transparent;padding:0}
.sig.hit{background:color-mix(in srgb,var(--up) 25%,transparent)}
.sig.miss{background:color-mix(in srgb,var(--down) 25%,transparent)}
.sig.silent{border-style:dashed;opacity:.5}
.sig-legend{margin-left:auto;font-size:var(--fs-11);color:var(--text-3);white-space:nowrap}
.mobile-bar{display:none}

/* ── Cặp: overlay tìm ──────────────────────────────────────────── */
.pairs{display:flex;flex-direction:column;gap:8px;max-height:70vh}
.pairs .tbl-wrap{overflow:auto;flex:1}
.pairs .filters{display:flex;gap:4px;flex-wrap:wrap}
.star{color:var(--text-3);background:transparent;border:0;cursor:pointer;font-size:14px;min-width:32px;min-height:32px}
.star.is-on{color:var(--accent)}

/* ── GATE · bot ────────────────────────────────────────────────── */
.gate{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.gate:last-child{border-bottom:0}
.lamp{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--text-3);background:transparent;flex:none}
.lamp.go{background:var(--up);border-color:var(--up)}.lamp.nogo{background:var(--down);border-color:var(--down)}
.risk-banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-2);border:1px solid var(--border);background:var(--surface-3);font-size:var(--fs-12)}
.risk-banner.paper{background:color-mix(in srgb,var(--info) 12%,transparent);border-color:var(--info)}
.risk-banner.live{background:color-mix(in srgb,var(--down) 12%,transparent);border-color:var(--down)}
.botcard{display:flex;flex-direction:column;gap:8px}
.botcard .status{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-12)}
.botcard .status .dot{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.botcard .status.on .dot{background:var(--up)}

/* ── Auth ──────────────────────────────────────────────────────── */
.auth-wrap{min-height:calc(100vh - 84px);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:min(420px,100%);background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-2);padding:24px;display:flex;flex-direction:column;gap:16px}
.auth-card h1{font-size:var(--fs-20);font-weight:600}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:3px;border-radius:2px;background:var(--surface-3)}
.steps span.done{background:var(--accent)}
.pw-checks{display:flex;flex-direction:column;gap:2px;font-size:var(--fs-11);color:var(--text-3)}
.pw-checks .ok{color:var(--up)}
.otp{display:flex;gap:6px}
.otp .input{text-align:center;font-family:var(--font-mono);font-size:var(--fs-20);letter-spacing:.4em}
.authenticator{border:1px dashed var(--border-strong);border-radius:var(--r-2);padding:10px 12px;font-size:var(--fs-12);color:var(--text-2)}
.authenticator .code{font-family:var(--font-mono);font-size:var(--fs-24);letter-spacing:.2em;color:var(--text-1)}

/* ── Account ───────────────────────────────────────────────────── */
.account{display:grid;grid-template-columns:240px minmax(0,720px);gap:var(--sp-4);padding:var(--sp-4);max-width:1100px;margin:0 auto}
.account .sidenav{display:flex;flex-direction:column;gap:2px}
.account .sidenav a{padding:10px 12px;border-radius:var(--r-1);color:var(--text-2);min-height:44px;display:flex;align-items:center}
.account .sidenav a:hover{background:var(--surface-2);text-decoration:none;color:var(--text-1)}
.account .sidenav a.is-active{background:var(--surface-2);color:var(--text-1);border-left:2px solid var(--accent)}
.perm{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:var(--fs-12);padding:8px 0}
.perm .yes{color:var(--up)}.perm .no{color:var(--text-3)}.perm .bad{color:var(--down-text,var(--down));font-weight:600}

/* ── Tabs của Tham vấn / Chỉ số ────────────────────────────────── */
.method{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border)}
.method:last-child{border-bottom:0}
.vote{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:24px;border-radius:var(--r-1);border:1px solid var(--border);font-size:var(--fs-11);font-weight:600;color:var(--text-2)}
.vote.up{border-color:var(--up);color:var(--up)}.vote.down{border-color:var(--down);color:var(--down-text,var(--down))}.vote.none{opacity:.6}
.votebar{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-3);gap:2px}
.votebar span{display:block;height:100%;background:var(--text-2)}
.votebar span.n{background:var(--text-3)}.votebar span.d{background:var(--text-1)}
.calib{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:var(--fs-11);text-align:center}
.calib .bar{height:40px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.calib .bar i{display:block;width:40%;background:var(--text-3)}.calib .bar i.pred{background:var(--pred)}

/* ══════════════════════════════════════════════════════════════════
   data.js — LỚP DỮ LIỆU THỊ TRƯỜNG (prototype v15)

   Ba đường dữ liệu theo docs/Old/05 §3.6 + skill visualize-dashboard §6:
     · giá/sổ lệnh/khớp lệnh: trình duyệt nối THẲNG Binance (REST + WebSocket
       công khai, không cần API key, không qua backend);
     · dự đoán: chưa có backend M9 → domain.js mô phỏng từ nến đã đóng;
     · lịch sử: REST một lần lúc mở trang.

   Khi không gọi được api.binance.com (artifact chặn mạng ngoài — CSP),
   lớp này tự chuyển sang CP_FALLBACK (ảnh chụp lúc build) và MÔ PHỎNG tick
   bằng bước đi ngẫu nhiên nhỏ. Trạng thái nguồn luôn được công bố qua
   `CP.data.source` để giao diện nói thật (RULE 8).
   ══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const CP = (window.CP = window.CP || {});

  const REST = 'https://api.binance.com/api/v3';
  const WS = 'wss://stream.binance.com:9443/stream?streams=';
  const TF_MS = { '1m': 6e4, '5m': 3e5, '15m': 9e5, '30m': 18e5, '1h': 36e5, '2h': 72e5, '4h': 144e5, '6h': 216e5, '12h': 432e5, '1d': 864e5, '1w': 6048e5 };

  /** Trạng thái độ tươi — 4 mức theo RULE 8. */
  const FRESH = { LIVE: 'live', SLOW: 'slow', DOWN: 'down', STALE: 'stale' };

  const state = {
    source: 'probing',          // 'live' | 'fallback' | 'probing'
    serverOffset: 0,            // serverTime − Date.now()
    lastTick: 0,                // ms — lần cuối nhận tick giá
    wsState: 'idle',            // 'idle' | 'open' | 'closed' | 'error'
    freshness: FRESH.DOWN,
    listeners: new Set(),       // callback(freshness)
  };

  // ── helpers ──────────────────────────────────────────────────────
  const now = () => Date.now() + state.serverOffset;

  function parseKline(r) {
    // Binance kline: [openTime, open, high, low, close, volume, closeTime, quoteVol, trades, ...]
    return { t: r[0], o: +r[1], h: +r[2], l: +r[3], c: +r[4], v: +r[5] };
  }

  async function getJSON(url, ms = 6000) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms);
    try {
      const res = await fetch(url, { signal: ctl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function setFreshness(f) {
    if (state.freshness === f) return;
    state.freshness = f;
    state.listeners.forEach((cb) => { try { cb(f); } catch (e) { console.error(e); } });
  }

  // Đồng hồ độ tươi: live < 5s, chậm < 30s, còn lại là mất kết nối.
  setInterval(() => {
    if (state.source === 'fallback') return; // fallback tự đặt trạng thái
    const age = Date.now() - state.lastTick;
    if (!state.lastTick || state.wsState !== 'open') setFreshness(FRESH.DOWN);
    else if (age < 5000) setFreshness(FRESH.LIVE);
    else if (age < 30000) setFreshness(FRESH.SLOW);
    else setFreshness(FRESH.DOWN);
  }, 1000);

  // ── thăm dò nguồn ────────────────────────────────────────────────
  let probe = null;
  function ensureSource() {
    if (probe) return probe;
    probe = (async () => {
      try {
        const t0 = Date.now();
        const { serverTime } = await getJSON(REST + '/time', 4000);
        state.serverOffset = serverTime - (t0 + (Date.now() - t0) / 2);
        state.source = 'live';
      } catch (e) {
        state.source = 'fallback';
        state.serverOffset = 0;
        // Dữ liệu chụp là dữ liệu cũ — không bao giờ tự nhận là Live.
        setFreshness(FRESH.STALE);
      }
      return state.source;
    })();
    return probe;
  }

  // ── REST ─────────────────────────────────────────────────────────
  async function klines(symbol, tf, limit = 240) {
    await ensureSource();
    if (state.source === 'live') {
      try {
        const rows = await getJSON(`${REST}/klines?symbol=${symbol}&interval=${tf}&limit=${limit}`);
        return rows.map(parseKline);
      } catch (e) { /* rơi xuống fallback */ }
    }
    return fallbackKlines(symbol, tf, limit);
  }

  async function tickers() {
    await ensureSource();
    if (state.source === 'live') {
      try {
        const rows = await getJSON(`${REST}/ticker/24hr`, 8000);
        return rows
          .filter((x) => x.symbol.endsWith('USDT') && +x.quoteVolume > 0 && !/UP|DOWN|BEAR|BULL/.test(x.symbol.replace('USDT', '')))
          .map((x) => ({ symbol: x.symbol, last: +x.lastPrice, pct: +x.priceChangePercent, high: +x.highPrice, low: +x.lowPrice, qv: +x.quoteVolume }))
          .sort((a, b) => b.qv - a.qv)
          .slice(0, 200);
      } catch (e) { /* fallback */ }
    }
    const fb = window.CP_FALLBACK;
    return fb ? fb.tickers.map((r) => ({ symbol: r[0], last: r[1], pct: r[2], high: r[3], low: r[4], qv: r[5] })) : [];
  }

  async function depth(symbol, limit = 20) {
    await ensureSource();
    if (state.source === 'live') {
      try {
        const d = await getJSON(`${REST}/depth?symbol=${symbol}&limit=${limit}`);
        return { bids: d.bids.map((x) => [+x[0], +x[1]]), asks: d.asks.map((x) => [+x[0], +x[1]]) };
      } catch (e) { /* fallback */ }
    }
    return fallbackDepth(symbol, limit);
  }

  async function trades(symbol, limit = 40) {
    await ensureSource();
    if (state.source === 'live') {
      try {
        const rows = await getJSON(`${REST}/aggTrades?symbol=${symbol}&limit=${limit}`);
        return rows.map((x) => ({ t: x.T, p: +x.p, q: +x.q, m: x.m }));
      } catch (e) { /* fallback */ }
    }
    return fallbackTrades(symbol, limit);
  }

  // ── WebSocket đa luồng ───────────────────────────────────────────
  // handlers: { kline(k, isClosed), ticker(t), depth(d), trade(tr) }
  let ws = null, wsSubs = [];
  function openWS(streams) {
    if (ws) { try { ws.close(); } catch (e) {} }
    state.wsState = 'idle';
    ws = new WebSocket(WS + streams.join('/'));
    ws.onopen = () => { state.wsState = 'open'; };
    ws.onclose = () => { state.wsState = 'closed'; setFreshness(FRESH.DOWN); };
    ws.onerror = () => { state.wsState = 'error'; };
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      const d = msg.data; if (!d) return;
      state.lastTick = Date.now();
      wsSubs.forEach((s) => {
        if (d.e === 'kline' && d.s === s.symbol && d.k.i === s.tf && s.h.kline) {
          const k = d.k;
          s.h.kline({ t: k.t, o: +k.o, h: +k.h, l: +k.l, c: +k.c, v: +k.v }, k.x);
        } else if (d.e === '24hrTicker' && d.s === s.symbol && s.h.ticker) {
          s.h.ticker({ symbol: d.s, last: +d.c, pct: +d.P, high: +d.h, low: +d.l, qv: +d.q, bid: +d.b, ask: +d.a });
        } else if (d.e === 'depthUpdate' && d.s === s.symbol && s.h.depth) {
          s.h.depth({ bids: d.b.map((x) => [+x[0], +x[1]]), asks: d.a.map((x) => [+x[0], +x[1]]) });
        } else if (d.e === 'aggTrade' && d.s === s.symbol && s.h.trade) {
          s.h.trade({ t: d.T, p: +d.p, q: +d.q, m: d.m });
        }
      });
    };
  }

  /** Đăng ký nhận tick cho một cặp/khung. Trả về hàm huỷ. */
  function subscribe(symbol, tf, h) {
    const sub = { symbol, tf, h, sim: null };
    wsSubs.push(sub);
    ensureSource().then((src) => {
      if (!wsSubs.includes(sub)) return;
      if (src === 'live') {
        const s = symbol.toLowerCase();
        openWS([`${s}@kline_${tf}`, `${s}@ticker`, `${s}@depth20@1000ms`, `${s}@aggTrade`]);
      } else {
        sub.sim = startSim(sub);
      }
    });
    return () => {
      wsSubs = wsSubs.filter((x) => x !== sub);
      if (sub.sim) sub.sim();
      if (!wsSubs.length && ws) { ws.close(); ws = null; }
    };
  }

  // ── FALLBACK: ảnh chụp + mô phỏng ────────────────────────────────
  function fallbackKlines(symbol, tf, limit) {
    const fb = window.CP_FALLBACK; if (!fb) return [];
    const bySym = fb.klines[symbol] || fb.klines.BTCUSDT;
    let rows = bySym[tf];
    if (!rows) {
      // Khung không có trong ảnh chụp → nội suy từ 1h (chỉ để prototype không trống).
      const base = bySym['1h'];
      const n = Math.max(1, Math.round((TF_MS[tf] || 36e5) / 36e5));
      rows = [];
      if (n >= 1 && TF_MS[tf] >= 36e5) {
        for (let i = 0; i + n <= base.length; i += n) {
          const g = base.slice(i, i + n);
          rows.push([g[0][0], g[0][1], Math.max(...g.map((x) => x[2])), Math.min(...g.map((x) => x[3])), g[g.length - 1][4], g.reduce((a, x) => a + x[5], 0)]);
        }
      } else {
        // khung < 1h: chia nến 1h thành các nến con dao động nhẹ
        const m = Math.round(36e5 / (TF_MS[tf] || 36e5));
        base.slice(-Math.ceil(limit / m) - 1).forEach((r) => {
          let p = r[1];
          for (let j = 0; j < m; j++) {
            const tgt = j === m - 1 ? r[4] : r[1] + (r[4] - r[1]) * ((j + 1) / m) + (r[2] - r[3]) * (Math.sin(j * 1.7 + r[0] / 1e7) * 0.18);
            const hi = Math.max(p, tgt) * (1 + 0.0004), lo = Math.min(p, tgt) * (1 - 0.0004);
            rows.push([r[0] + j * TF_MS[tf], p, hi, lo, tgt, r[5] / m]);
            p = tgt;
          }
        });
      }
    }
    return rows.slice(-limit).map((r) => ({ t: r[0], o: r[1], h: r[2], l: r[3], c: r[4], v: r[5] }));
  }

  function lastPriceOf(symbol) {
    const fb = window.CP_FALLBACK; if (!fb) return 100;
    const t = fb.tickers.find((r) => r[0] === symbol);
    if (t) return t[1];
    const k = fb.klines[symbol]; if (k && k['1h']) return k['1h'][k['1h'].length - 1][4];
    return 100;
  }

  function fallbackDepth(symbol, limit) {
    const fb = window.CP_FALLBACK;
    if (fb && fb.depth[symbol]) return fb.depth[symbol];
    const p = lastPriceOf(symbol), tick = p > 1000 ? 0.1 : p > 10 ? 0.01 : 0.0001;
    const bids = [], asks = [];
    for (let i = 1; i <= limit; i++) {
      bids.push([+(p - i * tick * 5).toFixed(6), +(Math.random() * 2 + 0.1).toFixed(4)]);
      asks.push([+(p + i * tick * 5).toFixed(6), +(Math.random() * 2 + 0.1).toFixed(4)]);
    }
    return { bids, asks };
  }

  function fallbackTrades(symbol, limit) {
    const fb = window.CP_FALLBACK;
    if (fb && fb.trades[symbol]) return fb.trades[symbol].slice(-limit).map((r) => ({ t: r[0], p: r[1], q: r[2], m: r[3] }));
    const p = lastPriceOf(symbol), out = [];
    for (let i = 0; i < limit; i++) out.push({ t: Date.now() - (limit - i) * 900, p: p * (1 + (Math.random() - 0.5) * 0.0006), q: +(Math.random()).toFixed(4), m: Math.random() < 0.5 });
    return out;
  }

  /** Mô phỏng tick khi không có mạng: bước đi ngẫu nhiên nhỏ quanh giá cuối. */
  function startSim(sub) {
    const ks = fallbackKlines(sub.symbol, sub.tf, 2);
    let cur = ks.length ? { ...ks[ks.length - 1] } : { t: Date.now(), o: 100, h: 100, l: 100, c: 100, v: 0 };
    const t0 = fallbackTickerOf(sub.symbol);
    let hi = t0.high, lo = t0.low;
    const tfms = TF_MS[sub.tf] || 36e5;
    // Nến mô phỏng bắt đầu từ "bây giờ" để countdown có nghĩa.
    cur = { t: Math.floor(Date.now() / tfms) * tfms, o: cur.c, h: cur.c, l: cur.c, c: cur.c, v: 0 };
    const id = setInterval(() => {
      const step = cur.c * (Math.random() - 0.5) * 0.0008;
      cur.c = +(cur.c + step).toFixed(8);
      cur.h = Math.max(cur.h, cur.c); cur.l = Math.min(cur.l, cur.c); cur.v += Math.random() * 0.5;
      hi = Math.max(hi, cur.c); lo = Math.min(lo, cur.c);
      state.lastTick = Date.now();
      setFreshness(FRESH.STALE); // dữ liệu mô phỏng — không bao giờ nhận là Live
      let closed = false;
      if (Date.now() >= cur.t + tfms) { closed = true; }
      sub.h.kline && sub.h.kline({ ...cur }, closed);
      if (closed) cur = { t: cur.t + tfms, o: cur.c, h: cur.c, l: cur.c, c: cur.c, v: 0 };
      sub.h.ticker && sub.h.ticker({ symbol: sub.symbol, last: cur.c, pct: (cur.c / t0.open - 1) * 100, high: hi, low: lo, qv: t0.qv, bid: cur.c * 0.99999, ask: cur.c * 1.00001 });
      if (sub.h.trade && Math.random() < 0.7) sub.h.trade({ t: Date.now(), p: cur.c, q: +(Math.random() * 0.8).toFixed(4), m: step < 0 });
      if (sub.h.depth && Math.random() < 0.3) sub.h.depth(fallbackDepth(sub.symbol, 20));
    }, 1000);
    return () => clearInterval(id);
  }

  function fallbackTickerOf(symbol) {
    const fb = window.CP_FALLBACK;
    const t = fb && fb.tickers.find((r) => r[0] === symbol);
    const last = t ? t[1] : lastPriceOf(symbol);
    const pct = t ? t[2] : 0;
    return { last, pct, high: t ? t[3] : last * 1.02, low: t ? t[4] : last * 0.98, qv: t ? t[5] : 0, open: last / (1 + pct / 100) };
  }

  // ── công khai ────────────────────────────────────────────────────
  CP.data = {
    FRESH, TF_MS,
    get source() { return state.source; },
    get freshness() { return state.freshness; },
    get lastTick() { return state.lastTick; },
    now, ensureSource, klines, tickers, depth, trades, subscribe,
    onFreshness(cb) { state.listeners.add(cb); return () => state.listeners.delete(cb); },
  };
})();

(function () {
  'use strict';
  const CP = (window.CP = window.CP || {});

    try {
      if (v === undefined) { const s = localStorage.getItem('cp15.' + k); return s ? JSON.parse(s) : null; }
      localStorage.setItem('cp15.' + k, JSON.stringify(v));
    } catch (e) { return null; }
  };
  const uid = () => Math.random().toString(36).slice(2, 10);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  // ── Chi phí thật (RULE 5) — KHÔNG tính thuế: người dùng tự khai (quyết định chủ dự án 27/08/2026, 00_VISION §4)
  const COSTS = { taker: 0.001, slippage: 0.0005, roundTrip() { return 2 * (this.taker + this.slippage); } };
  CP.costs = COSTS;

  // ── Khung nhìn → model (docs/Old/05 §3.2) ────────────────────────
  const MODEL_OF = (tf) => (['1m', '5m', '15m', '30m', '1h'].includes(tf) ? { model: '1h', horizonH: 4, bars: 4 } : ['2h', '4h', '6h'].includes(tf) ? { model: '4h', horizonH: 24, bars: 6 } : { model: '1d', horizonH: 24, bars: 1 });

  // ── toán tiện ích ───────────────────────────────────────────────
  const ema = (arr, n) => { const k = 2 / (n + 1); let e = arr[0]; const out = [e]; for (let i = 1; i < arr.length; i++) { e = arr[i] * k + e * (1 - k); out.push(e); } return out; };
  const std = (arr) => { if (arr.length < 2) return 0; const m = arr.reduce((a, b) => a + b, 0) / arr.length; return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / (arr.length - 1)); };
  const zscore = (arr) => { const s = std(arr); const m = arr.reduce((a, b) => a + b, 0) / arr.length; return s ? (arr[arr.length - 1] - m) / s : 0; };
  const logret = (ks) => ks.slice(1).map((k, i) => Math.log(k.c / ks[i].c));

  // ── Hiệu chỉnh mô phỏng: điểm thô → p_up "đã hiệu chỉnh" ─────────
  // Ép vào [0,38 · 0,66] để mô phỏng đúng thực tế: model trung thực hiếm khi vượt 65%.
  const calibrate = (score) => clamp(0.5 + 0.16 * Math.tanh(score), 0.34, 0.66);
  const DEAD = 0.08; // vùng chết ±8 điểm quanh 50% → KHÔNG RÕ

  /** Mức độ chọn lọc `level` của một dự đoán, từ khoảng cách tới 50%. */
  const levelOf = (p) => { const d = Math.abs(p - 0.5); return d >= 0.15 ? 1 : d >= 0.12 ? 0.75 : d >= 0.10 ? 0.5 : d >= DEAD ? 0.25 : 0; };

  // ── DỰ ĐOÁN TẦNG 1 (mô phỏng) ───────────────────────────────────
  /**
   * Tính dự đoán tại nến đóng cuối cùng của mảng `closed` (không dùng nến dở dang).
   * Chỉ dùng dữ liệu ≤ close[t] (RULE 2 — mọi đầu vào đã "dịch" khỏi tương lai).
   */
  function predictAt(closed, tf, symbol) {
    const n = closed.length;
    if (n < 60) return null;
    const m = MODEL_OF(tf);
    const cs = closed.map((k) => k.c);
    const lr = logret(closed);
    const sigma = std(lr.slice(-24)) || 1e-4;                 // σ̂ mỗi nến
    const sigH = sigma * Math.sqrt(m.bars);                    // σ̂ theo chân trời
    const e50 = ema(cs, 50), e200 = ema(cs, Math.min(200, n - 1));
    const trend = (e50[n - 1] - e200[n - 1]) / (e200[n - 1] * sigma * 10);     // PP4 — quy tắc hướng sơ cấp
    const mom = lr.slice(-12).reduce((a, b) => a + b, 0) / (sigma * Math.sqrt(12)); // log_ret_12
    const last = closed[n - 1];
    const rng = last.h - last.l || 1e-9;
    const cpos = (last.c - last.l) / rng - 0.5;                // close_position_in_range
    const score = 0.9 * trend + 0.5 * mom + 0.6 * cpos;
    const pUp = calibrate(score);
    const level = levelOf(pUp);
    const dir = pUp >= 0.5 + DEAD ? 'UP' : pUp <= 0.5 - DEAD ? 'DOWN' : 'FLAT';
    const q50 = last.c * Math.exp(0.15 * (pUp - 0.5) * sigH * 6);
    const q10 = q50 * Math.exp(-1.2816 * sigH);
    const q90 = q50 * Math.exp(1.2816 * sigH);
    // Rào chắn ADR-017: SL 1,2σ̂ · TP 6,0σ̂ (không cho user chỉnh — ADR-018 trục A)
    const sl = 1.2, tp = 6.0;
    const cR = COSTS.roundTrip() / sigH;                       // chi phí quy về σ̂
    const pRequired = (sl + cR) / (tp + sl);                   // ngưỡng thắng để hoà vốn
    const t0 = last.t + CP.data.TF_MS[tf];                     // nến đóng lúc nào
    return {
      id: `${symbol}|${last.t}|${level}|sim`,
      symbol, tf, model: m.model, horizonH: m.horizonH,
      issuedAt: t0, validUntil: t0 + m.horizonH * 36e5,
      anchor: last.c, direction: dir, pUp, pRequired, level,
      q10, q50, q90, sigma: sigH, expectedMovePct: sigH * 100,
      barrier: { slSigma: sl, tpSigma: tp, sl: dir === 'DOWN' ? last.c * Math.exp(sl * sigH) : last.c * Math.exp(-sl * sigH), tp: dir === 'DOWN' ? last.c * Math.exp(-tp * sigH) : last.c * Math.exp(tp * sigH) },
      silenceReason: dir === 'FLAT' ? 'p_up trong vùng ±8 điểm quanh 50% — không đủ bằng chứng' : null,
      simulated: true,
    };
  }

  /** Dự đoán hiện hành + lịch sử đã chấm (track record) cho một cặp/khung. */
  function series(klines, tf, symbol, opts = {}) {
    const closed = klines.slice(0, -1);              // nến cuối đang hình thành → bỏ
    const m = MODEL_OF(tf);
    const cur = predictAt(closed, tf, symbol);
    const hist = [];
    const back = opts.back || 120;
    for (let i = Math.max(60, closed.length - back); i < closed.length - m.bars; i++) {
      const p = predictAt(closed.slice(0, i + 1), tf, symbol);
      if (!p) continue;
      const out = closed[i + m.bars].c;
      const ret = Math.log(out / p.anchor);
      let hit = null, R = 0;
      if (p.direction !== 'FLAT') {
        hit = p.direction === 'UP' ? out > p.anchor : out < p.anchor;
        // R mô phỏng: chạm TP/SL trong chân trời theo đường đóng cửa
        const path = closed.slice(i + 1, i + 1 + m.bars);
        const sgn = p.direction === 'UP' ? 1 : -1;
        let r = null;
        for (const k of path) {
          const hi = sgn * Math.log(k.h / p.anchor), lo = sgn * Math.log(k.l / p.anchor);
          if (lo <= -p.barrier.slSigma * p.sigma / Math.sqrt(m.bars) * Math.sqrt(m.bars)) { r = -1; break; }
          if (hi >= p.barrier.tpSigma * p.sigma) { r = p.barrier.tpSigma / p.barrier.slSigma; break; }
        }
        if (r === null) r = (sgn * ret) / (p.barrier.slSigma * p.sigma);
        R = r - COSTS.roundTrip() / (p.barrier.slSigma * p.sigma);
      }
      hist.push({ ...p, outcomeClose: out, retPct: ret * 100, hit, R });
    }
    return { current: cur, history: hist, model: m };
  }

  /** Thống kê track record: luôn kèm n= (TRACK-02). */
  function stats(hist, minLevel = 0.25) {
    const acted = hist.filter((h) => h.direction !== 'FLAT' && h.level >= minLevel);
    const n = acted.length, hits = acted.filter((h) => h.hit).length;
    const gains = acted.filter((h) => h.R > 0).reduce((a, h) => a + h.R, 0);
    const losses = -acted.filter((h) => h.R < 0).reduce((a, h) => a + h.R, 0);
    return {
      n, hits, misses: n - hits, silent: hist.length - hist.filter((h) => h.direction !== 'FLAT').length,
      accuracy: n ? hits / n : null,
      profitFactor: losses > 0 ? gains / losses : (gains > 0 ? Infinity : null),
      totalR: acted.reduce((a, h) => a + h.R, 0),
      enough: n >= 100,
    };
  }

  CP.pred = { MODEL_OF, predictAt, series, stats, DEAD, calibrate, levelOf };

  /** Đếm phiếu — KHÔNG PHẢI XÁC SUẤT. Các phương pháp không độc lập (57 đặc trưng ~ 13 chiều thật). */

  // ── AUTH — tài khoản, phiên, 2FA, audit (ACC-01/03/05) ───────────
  async function sha(s) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  const auth = {
    users() { return LS('users') || {}; },
    session() { return LS('session'); },
    current() { const s = this.session(); if (!s || s.exp < Date.now()) return null; const u = this.users()[s.email]; return u ? { email: u.email, twoFA: !!u.twoFA, createdAt: u.createdAt, prefs: u.prefs || {} } : null; },
    async signUp(email, password, acceptTerms) {
      email = (email || '').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Email không hợp lệ');
      if ((password || '').length < 10) throw new Error('Mật khẩu tối thiểu 10 ký tự');
      if (!acceptTerms) throw new Error('Cần đồng ý điều khoản & tuyên bố miễn trừ (LEGAL-02)');
      const users = this.users();
      if (users[email]) throw new Error('Email đã đăng ký');
      const salt = uid();
      // Prototype: SHA-256 + salt. Bản thật: argon2id (ACC-01 — thuật toán chậm).
      users[email] = { email, salt, hash: await sha(salt + password), createdAt: Date.now(), twoFA: false, prefs: { tier: 'balanced', lang: 'vi', theme: 'dark' } };
      LS('users', users);
      this.audit('signup', { email });
      return this.login(email, password);
    },
    async login(email, password) {
      email = (email || '').trim().toLowerCase();
      const u = this.users()[email];
      if (!u || u.hash !== (await sha(u.salt + password))) throw new Error('Email hoặc mật khẩu không đúng');
      LS('session', { email, exp: Date.now() + 12 * 36e5, twoFAok: false });
      this.audit('login', { email });
      return this.current();
    },
    logout() { const s = this.session(); if (s) this.audit('logout', { email: s.email }); LS('session', null); },
    /** 2FA mô phỏng: prototype tự sinh mã 6 số và hiển thị trong "ứng dụng xác thực giả lập". */
    twoFACode() { const s = this.session(); if (!s) return null; const t = Math.floor(Date.now() / 30000); return String((parseInt(s.email.length + '' + t, 10) * 9301 + 49297) % 233280).padStart(6, '0').slice(-6); },
    enable2FA(code) { const s = this.session(); if (!s) throw new Error('Chưa đăng nhập'); if (code !== this.twoFACode()) throw new Error('Mã 2FA không đúng'); const users = this.users(); users[s.email].twoFA = true; LS('users', users); s.twoFAok = true; LS('session', s); this.audit('2fa_enabled', { email: s.email }); },
    verify2FA(code) { const s = this.session(); if (!s) return false; if (code !== this.twoFACode()) throw new Error('Mã 2FA không đúng'); s.twoFAok = true; LS('session', s); return true; },
    twoFAVerified() { const s = this.session(); return !!(s && s.twoFAok); },
    setPrefs(p) { const s = this.session(); if (!s) return; const users = this.users(); users[s.email].prefs = { ...(users[s.email].prefs || {}), ...p }; LS('users', users); if (p.tier) this.audit('tier_changed', { email: s.email, tier: p.tier }); },
    audit(action, meta) { const log = LS('audit') || []; log.push({ id: uid(), at: Date.now(), action, ...meta }); LS('audit', log.slice(-500)); },
    auditLog() { const s = this.session(); return (LS('audit') || []).filter((a) => !s || a.email === s.email).reverse(); },
    deleteAccount() { const s = this.session(); if (!s) return; const users = this.users(); delete users[s.email]; LS('users', users); link.revoke('account_deleted'); this.audit('account_deleted', { email: s.email }); LS('session', null); },
  };

  const link = {
    get() { const u = auth.current(); if (!u) return null; return (LS('links') || {})[u.email] || null; },
    /**
     * Mô phỏng gọi GET /sapi/v1/account/apiRestrictions. `simulate` chọn kịch bản

    async connect({ apiKey, secret, simulate = 'ok' }) {

      if (!/^[A-Za-z0-9]{64}$/.test(apiKey || '')) throw new Error('API key phải là 64 ký tự chữ-số');
      if (!/^[A-Za-z0-9]{64}$/.test(secret || '')) throw new Error('Secret key phải là 64 ký tự chữ-số');
      await new Promise((r) => setTimeout(r, 900));
      const perms = simulate === 'withdraw' ? { enableReading: true, enableSpotAndMarginTrading: true, enableWithdrawals: true, ipRestrict: false }
        : simulate === 'readonly' ? { enableReading: true, enableSpotAndMarginTrading: false, enableWithdrawals: false, ipRestrict: true }

      if (perms.enableWithdrawals) {

      const rec = { email: u.email, fp: '…' + apiKey.slice(-4), perms, linkedAt: Date.now(), lastCheck: Date.now(), status: perms.enableSpotAndMarginTrading ? 'trade' : 'readonly', balances: this.mockBalances() };
      const all = LS('links') || {}; all[u.email] = rec; LS('links', all);

      return rec;
    },

    revoke(reason = 'user') { const u = auth.current(); if (!u) return; const all = LS('links') || {}; if (all[u.email]) { delete all[u.email]; LS('links', all); bots.stopAll('link_revoked'); auth.audit('link_revoked', { email: u.email, reason }); } },

    derive(ev) {

  const MIN_NOTIONAL = 10;
  const paper = {
    MIN_NOTIONAL,
    key() { const u = auth.current(); return u ? u.email : 'anon'; },
    _all() { return LS('paper') || {}; },
    state() {
      const all = this._all(); const k = this.key();
      if (!all[k]) { all[k] = { period: 1, startedAt: Date.now(), cash: 10000, positions: {}, orders: [], fills: [], equityLog: [[Date.now(), 10000]] }; LS('paper', all); }
      return all[k];
    },
    save(s) { const all = this._all(); all[this.key()] = s; LS('paper', all); },
    /** Xem trước lệnh — mọi quy ước hiển thị TRƯỚC khi bấm (PAPER-02). */
    preview({ symbol, side, type, price, quoteQty, baseQty, last }) {
      const s = this.state();
      const px = type === 'LIMIT' ? +price : last;
      const errors = [], warnings = [];
      if (!px || px <= 0) errors.push('Chưa có giá');
      let base = baseQty ? +baseQty : quoteQty ? +quoteQty / px : 0;
      let quote = base * px;
      const pos = s.positions[symbol] || { qty: 0, avg: 0 };
      if (side === 'BUY') {
        const maxQuote = s.cash / (1 + COSTS.taker + (type === 'MARKET' ? COSTS.slippage : 0));
        if (quote > maxQuote + 1e-9) { warnings.push(`Kẹp theo số dư: tối đa ${maxQuote.toFixed(2)} USDT`); quote = maxQuote; base = quote / px; }
      } else {
        if (base > pos.qty + 1e-12) { warnings.push(`Kẹp theo số coin đang giữ: ${pos.qty}`); base = pos.qty; quote = base * px; }
        if (pos.qty <= 0) errors.push('Không có coin để bán (spot — không bán khống)');
      }
      if (quote < MIN_NOTIONAL) errors.push(`Lệnh tối thiểu ${MIN_NOTIONAL} USDT`);
      const fee = quote * COSTS.taker, slip = type === 'MARKET' ? quote * COSTS.slippage : 0;
      const equity = this.equity(last ? { [symbol]: last } : {});
      const pctNav = equity ? (quote / equity) * 100 : 0;
      if (pctNav > 50) warnings.push('Lệnh > 50% số dư — cần xác nhận thêm (UI-10)');
      return { ok: errors.length === 0, errors, warnings, px, base, quote, fee, slip, total: side === 'BUY' ? quote + fee + slip : quote - fee - slip, pctNav, needsConfirm: pctNav > 50 };
    },
    place(req) {
      const pv = this.preview(req); if (!pv.ok) throw new Error(pv.errors[0]);
      const s = this.state();
      const o = { id: uid(), at: Date.now(), symbol: req.symbol, side: req.side, type: req.type, price: pv.px, qty: pv.base, quote: pv.quote, status: 'NEW', mode: 'PAPER', predictionId: req.predictionId || null };

      sigma,
    };
  }

/* ══════════════════════════════════════════════════════════════════
   screens/markets.js — THỊ TRƯỜNG: danh sách cặp USDT, lọc, sắp xếp,
   cột Dự đoán 1d (tím, mô phỏng) cho ★ yêu thích + top 8 theo khối lượng.
   ══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const CP = window.CP;
  const { h, clear, put, fmt, freshness, chip, dirBadge, table, empty, DIR } = CP.ui;
  let offs = [], timers = [], els = {}, list = [], preds = {}, q = '', filter = localStorage.getItem('cp15.mk.filter') || 'all', sort = localStorage.getItem('cp15.mk.sort') || 'qv', prevPrice = {};

  CP.ui.injectCSS('markets', `
    .mk-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .mk-bar .input{max-width:260px}
    .mk-bar .spacer{flex:1}
    .tbl.mk tbody tr{height:36px}
    .tbl.mk td.price{transition:none}
    @media(max-width:767px){.tbl.mk .hide-m{display:none}}
  `);

  const favs = () => CP.state.get('favorites');
  const STABLE = /^(USDC|FDUSD|USD1|RLUSD|TUSD|DAI|BUSD|USDP|PYUSD|EUR|EURI|XUSD|USDE|USDD)USDT$/;
  async function loadPreds() {
    const targets = [...new Set([...favs(), ...list.slice(0, 8).map((t) => t.symbol)])];
    for (const sym of targets) {
      if (preds[sym] !== undefined) continue;
      if (STABLE.test(sym)) { preds[sym] = 'stable'; continue; }
      preds[sym] = null;
      try { const ks = await CP.data.klines(sym, '1d', 120); preds[sym] = CP.pred.series(ks, '1d', sym, { back: 5 }).current || false; } catch (e) { preds[sym] = false; }
      if (els.table) draw();
    }
  }
  function draw() {
    const el = els.table; if (!el) return; clear(el);
    if (!list.length) { el.append(CP.ui.skeleton(320)); return; }
    let rows = list.filter((t) => !q || t.symbol.includes(q));
    if (filter === 'fav') rows = rows.filter((t) => favs().includes(t.symbol));
    if (filter === 'gain') rows = rows.filter((t) => t.pct > 0);
    if (filter === 'lose') rows = rows.filter((t) => t.pct < 0);
    rows = rows.slice().sort((a, b) => sort === 'pct' ? b.pct - a.pct : sort === 'pctasc' ? a.pct - b.pct : b.qv - a.qv).slice(0, 150);
    const tbl = table([{ label: '' }, { label: 'Cặp' }, { label: 'Giá', num: 1 }, { label: '24h', num: 1 }, { label: 'Cao / Thấp 24h', num: 1 }, { label: 'KL USDT', num: 1 }, { label: 'Dự đoán 1d' }], rows.map((t) => {
      const p = preds[t.symbol];
      const predCell = p === 'stable' ? h('span', { class: 'faint' }, '— stablecoin') : p ? Object.assign(dirBadge(p.direction, p.pUp), { className: 'badge master badge-' + DIR[p.direction].cls, style: 'height:24px;font-size:11px' }) : p === null ? h('span', { class: 'faint' }, '…') : h('span', { class: 'faint' }, '—');
      const flash = prevPrice[t.symbol] != null && prevPrice[t.symbol] !== t.last ? (t.last > prevPrice[t.symbol] ? 'flash-up' : 'flash-down') : '';
      return [
        h('button', { class: 'star ' + (favs().includes(t.symbol) ? 'is-on' : ''), 'aria-label': 'Ưa thích ' + t.symbol, onClick: (e) => { e.stopPropagation(); const f = favs(); CP.state.set({ favorites: f.includes(t.symbol) ? f.filter((x) => x !== t.symbol) : [...f, t.symbol] }); loadPreds(); draw(); } }, favs().includes(t.symbol) ? '★' : '☆'),
        h('span', { class: 'strong' }, fmt.base(t.symbol), h('span', { class: 'faint' }, '/USDT')),
        h('span', { class: 'num price ' + flash + (CP.data.freshness === 'down' ? ' faint' : '') }, fmt.price(t.last)),
        h('span', { class: 'num ' + (t.pct >= 0 ? 'up-text' : 'down-text') }, (t.pct >= 0 ? '▲ ' : '▼ ') + fmt.pct(t.pct)),
        h('span', { class: 'num faint hide-m' }, fmt.price(t.high) + ' / ' + fmt.price(t.low)),
        h('span', { class: 'num' }, fmt.compact(t.qv)),
        predCell,
      ];
    }), { cls: 'mk', empty: 'Không tìm thấy cặp' });
    // đánh dấu cột ẩn trên mobile + hàng click được
    tbl.querySelectorAll('thead th:nth-child(5)').forEach((th) => th.classList.add('hide-m'));
    tbl.querySelectorAll('tbody tr').forEach((tr, i) => { if (!rows[i]) return; tr.classList.add('clickable'); tr.tabIndex = 0; const go = () => { CP.state.set({ symbol: rows[i].symbol }); CP.router.go('trade'); }; tr.addEventListener('click', go); tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); }); });
    el.append(tbl);
    prevPrice = Object.fromEntries(list.map((t) => [t.symbol, t.last]));
  }
  function renderBar() {
    const el = els.bar; clear(el);
    const inp = h('input', { class: 'input', placeholder: 'Tìm cặp (BTC, ETH…)', 'aria-label': 'Tìm cặp', value: q, onInput: (e) => { q = e.target.value.trim().toUpperCase(); draw(); } });
    put(el, inp,
      h('div', { class: 'seg' }, [['all', 'USDT'], ['fav', '★ Yêu thích'], ['gain', 'Tăng'], ['lose', 'Giảm']].map(([k, l]) => h('button', { class: 'seg-btn ' + (filter === k ? 'is-active' : ''), onClick: () => { filter = k; localStorage.setItem('cp15.mk.filter', k); renderBar(); draw(); } }, l))),
      h('div', { class: 'seg' }, [['qv', 'KL'], ['pct', '24h ↓'], ['pctasc', '24h ↑']].map(([k, l]) => h('button', { class: 'seg-btn ' + (sort === k ? 'is-active' : ''), onClick: () => { sort = k; localStorage.setItem('cp15.mk.sort', k); renderBar(); draw(); } }, l))),
      h('span', { class: 'spacer' }), chip('Dự đoán 1d: MÔ PHỎNG · ' + CP.verify.current().label, 'chip-sim'), freshness(CP.data.freshness, CP.data.lastTick, 'Giá'));
    if (els.focusSearch) { els.focusSearch = false; setTimeout(() => inp.focus(), 30); }
  }
  async function refresh() { try { list = await CP.market.loadTickers(); draw(); loadPreds(); } catch (e) { /* giữ bảng cũ */ } }

  CP.screens.register('markets', {
    title: 'Thị trường', auth: false,
    async mount(outlet, { params }) {
      els = { bar: h('div', { class: 'mk-bar' }), table: h('div', { class: 'tbl-wrap' }), focusSearch: !!params.q };
      outlet.append(h('div', { class: 'page' }, h('div', { class: 'subhead' }, h('h1', {}, 'Thị trường'), h('span', { class: 'muted small' }, 'cặp USDT trên Binance · cập nhật 10 s')), els.bar, els.table,
        h('p', { class: 'faint small mt-3' }, 'Cột Dự đoán 1d chỉ tính cho cặp ★ yêu thích và 8 cặp khối lượng lớn nhất; cặp ngoài tập huấn luyện ghi "—". Tím = do model sinh ra, mô phỏng, hiệu suất giả định.')));
      renderBar(); draw();
      list = CP.market.tickersList; if (list.length) { draw(); loadPreds(); }
      await refresh();
      timers.push(setInterval(refresh, 10000));
      offs.push(CP.market.on('fresh', () => { renderBar(); draw(); }), CP.state.subscribe((keys) => { if (keys.includes('favorites')) draw(); }));
    },
    unmount() { offs.forEach((f) => f()); offs = []; timers.forEach(clearInterval); timers = []; },
  });

(function () {
  'use strict';
  const CP = window.CP;
  const { h, clear, put, fmt, panel, freshness, chip, table, modal, sparkline, empty } = CP.ui;
  let offs = [], els = {}, cache = null, tab = null;

  CP.ui.injectCSS('indicators', `

  const GROUP_NOTES = {
    'Động lượng': 'RSI, MACD, Stochastic bị bác không phải vì "vô dụng" — thông tin của chúng đã có trong lợi suất log (r ≈ 0,85 với log_ret_12), ở dạng đơn giản hơn và không có tham số ẩn. Vẫn hiển thị cho trader quen mắt; không vào model.',

    'Cấu trúc': 'Ba đặc trưng price action sống sót sau phản biện: quét-rồi-lấy-lại, khoảng cách tới đỉnh/đáy, khoảng cách tới số tròn. Order block / FVG / BOS không tái lập được giữa hai người cài đặt.',
    'Biến động': 'Nền tảng của mọi thứ: σ̂ quyết định dải q10–q90, rào chắn 1,2σ̂/6,0σ̂ và ngưỡng hoà vốn.',
  };
  const fmtVal = (d) => { const v = d.value; if (v == null) return '—'; switch (d.fmt) { case '%': return fmt.pct(v, 2, false); case 'z': return v.toFixed(2) + ' σ'; case 'n': return v.toFixed(1); case 'd': return ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][v] || String(v); case '-': return '—'; default: return (+v).toFixed(3); } };
  const chipOf = (d) => d.chip === CP.indicators.OFFICIAL ? chip(d.chip, 'chip-official') : d.chip === CP.indicators.REJECTED ? chip(d.chip, 'chip-rejected') : chip(d.chip, 'chip-pending');

  /** Tính một lần: giá trị hiện tại + 40 điểm lịch sử (cửa sổ trượt) + percentile 120 cửa sổ. */
  function compute() {
    const closed = CP.market.closed(); if (closed.length < 60) return null;
    const list = CP.indicators.compute(closed);
    const n = closed.length; const W = Math.min(120, n - 60);
    return list.map((d) => {
      if (d.value == null || d.fmt === '-' || d.fmt === 'd') return { ...d, series: [], pct: null };
      const series = []; let below = 0, total = 0;
      for (let i = n - W; i <= n; i += 1) { let v = null; try { v = d.calc(closed.slice(0, i)); } catch (e) { v = null; } if (v == null || !isFinite(v)) continue; total++; if (v <= d.value) below++; if (i > n - 40) series.push(v); }

  }
  function renderTable() {

    if (!cache) { el.append(CP.ui.skeleton(200)); return; }
    const rows = cache.filter((d) => d.group === tab);
    put(el, GROUP_NOTES[tab] && h('div', { class: 'note ind-tab-note' }, GROUP_NOTES[tab]),
      table(['Chỉ số', { label: 'Giá trị', num: 1 }, { label: 'Percentile 120 cửa sổ', num: 1 }, '40 cửa sổ gần nhất', 'Nguồn gốc', 'Vào model?'], rows.map((d) => [
        h('div', {}, h('div', { class: 'ind-val' }, d.name), h('div', { class: 'ind-note' }, d.id + ' · ' + d.note)),
        h('span', { class: 'num strong' }, fmtVal(d)),
        h('span', { class: 'num' }, d.pct == null ? '—' : 'p' + d.pct),
        d.series.length > 2 ? sparkline(d.series) : h('span', { class: 'faint' }, '—'),
        chipOf(d),
        h('span', { class: d.chip === CP.indicators.OFFICIAL ? 'up-text' : 'faint' }, d.chip === CP.indicators.OFFICIAL ? '✓ có' : d.chip === CP.indicators.PENDING ? '— khi có dữ liệu' : '✗ không'),
      ]), { empty: 'Nhóm này chưa có chỉ số' }));
  }
  function renderOfficial() {
    const el = els.official; clear(el); if (!cache) return;
    const off = cache.filter((d) => d.chip === CP.indicators.OFFICIAL), pend = cache.filter((d) => d.chip === CP.indicators.PENDING);
    put(el, h('p', { class: 'muted small' }, '57 đặc trưng từng đề xuất gom thành 13 cụm độc lập; mỗi cụm một đại diện. Thêm chỉ báo cùng cụm là tiêu suất mà không thêm chiều.'),
      h('div', { class: 'grid-2' },
        h('div', {}, h('div', { class: 'strong small' }, `Bộ chính thức (${off.length})`), h('ul', { class: 'small muted', style: { margin: '4px 0 0', paddingLeft: '18px' } }, off.map((d) => h('li', {}, h('span', { class: 'mono' }, d.id), ' — ', d.name)))),
        h('div', {}, h('div', { class: 'strong small' }, `Chờ nguồn dữ liệu (${pend.length})`), h('ul', { class: 'small muted', style: { margin: '4px 0 0', paddingLeft: '18px' } }, pend.map((d) => h('li', {}, h('span', { class: 'mono' }, d.id), ' — ', d.note))))));

  CP.screens.register('indicators', {
    title: 'Chỉ số', auth: false,
    async mount(outlet) {
      els = { head: h('div', { class: 'subhead' }), tabs: h('div', { class: 'tabs', role: 'tablist' }), table: h('div', {}), official: h('div', {}) };
      outlet.append(h('div', { class: 'page' }, els.head,
        h('div', { class: 'note note-pred' }, 'Kết luận HƯỚNG chỉ có ở Giao dịch / Phương pháp (một badge chủ). Trang này đo, không kết luận — giá trị chỉ số không mang màu tăng/giảm.'),
        panel({ id: 'ind-table', title: 'Bảng chỉ số', subtitle: 'chip nguồn gốc theo sổ đăng ký đặc trưng (docs/Old/14)', collapsible: false, cls: 'mt-3', body: h('div', {}, els.tabs, els.table) }),

      const mth = CP.methods.find((x) => x.id === id); if (!mth || !mth.votes) return;

      h('form', { class: 'stack', onSubmit: (e) => { e.preventDefault(); try { CP.auth.verify2FA(inp.value.trim()); toast('Đã xác thực', 'ok'); finish(next); } catch (ex) { setErr(err, ex.message); } } },
